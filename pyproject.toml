[project]
name = "tailoring-ms"
version = "1.0.0"
description = "Offline-first tailoring management for a single shop"
requires-python = ">=3.12"
dependencies = ["fastapi==0.162.0", "uvicorn==0.54.0", "SQLAlchemy==2.1.6", "alembic==1.20.1", "python-multipart==0.0.32"]
[dependency-groups]
dev = ["pytest==9.1.1", "httpx==0.28.1"]
[tool.pytest.ini_options]
testpaths = ["backend/tests"]
pythonpath = ["backend"]
