[package]
name = "tailoring-desktop"
version = "1.0.0"
description = "Thread & Ledger tailoring management desktop"
authors = ["Thread & Ledger"]
edition = "2021"
rust-version = "1.90"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-single-instance = "2"
tauri-plugin-dialog = "2"
serde_json = "1"

[features]
custom-protocol = ["tauri/custom-protocol"]
